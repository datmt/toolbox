<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osui</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">osui <span id="conn" class="dot off" title="daemon connection"></span><span id="connText" class="muted">waiting for daemon…</span></div>
  <nav id="tabs">
    <button data-tab="prompts" class="active">Prompts <span id="promptBadge" class="badge hidden">0</span></button>
    <button data-tab="allow">Allowlists</button>
    <button data-tab="rules">Rules <span id="ruleCount" class="muted"></span></button>
    <button data-tab="log">Connections</button>
  </nav>
  <div id="stats" class="muted"></div>
  <div class="hbtns">
    <button id="assistantToggle" class="ghost" title="Toggle assistant sidebar" aria-expanded="false">✦ Assistant</button>
    <button id="gear" class="ghost" title="Settings" aria-label="Settings">⚙</button>
  </div>
</header>

<div class="layout">
  <main>
    <section id="tab-prompts"></section>
    <section id="tab-allow" class="hidden"></section>
    <section id="tab-rules" class="hidden"></section>
    <section id="tab-log" class="hidden"></section>
    <section id="tab-settings" class="hidden"></section>
  </main>

  <aside id="assistant" class="collapsed" aria-label="Assistant">
    <div class="ahead">
      <b>Assistant</b>
      <span id="askModel" class="muted"></span>
      <span class="spacer"></span>
      <button id="chatClear" class="small ghost" title="Clear conversation">Clear</button>
      <button id="assistantClose" class="small ghost" aria-label="Close sidebar">✕</button>
    </div>
    <div id="chatLog"></div>
    <div class="composer">
      <textarea id="askText" rows="3" placeholder="Ask about your rules or describe a change… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="askSend" class="primary">Send</button>
    </div>
  </aside>
</div>

<dialog id="editor">
  <form method="dialog" id="editorForm">
    <h3 id="editorTitle">Edit rule</h3>
    <textarea id="editorText" spellcheck="false" rows="22"></textarea>
    <p id="editorErr" class="err"></p>
    <div class="row end">
      <button value="cancel" class="ghost">Cancel</button>
      <button id="editorSave" value="save" class="primary">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
